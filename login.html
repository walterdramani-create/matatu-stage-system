<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Login - Matatu Stage System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <div class="login-wrap">
    <div class="login-box card">
      <img src="images/logo.png" alt="Web Based Matatu Stage Management System" class="logo">
      <p class="sub">Real-time transport information</p>

      <!-- PHP error message will show here later -->
      <div class="message error" id="login-error" style="display:none;">Wrong username or password.</div>

      <form action="#" method="post" id="login-form">
        <div class="form-group">
          <label for="username">Username or email</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <p class="small"><a href="index.html">Back to commuter view</a></p>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
