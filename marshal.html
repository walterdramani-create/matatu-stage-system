<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marshal Panel - Matatu Stage System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="marshal">
  <div class="layout">
    <aside class="sidebar">
      <img src="images/logo.png" alt="Web Based Matatu Stage Management System" class="logo">
      <a href="marshal.html" class="link active">Stage control</a>
      <div class="bottom"><a href="api/logout.php" class="link">Logout</a></div>
    </aside>

    <main class="main">
      <h1>Stage control</h1>
      <p class="sub">Log departures and update the queue at your stage.</p>
      <div id="marshal-msg" class="message" style="display:none;"></div>

      <!-- FR-07 -->
      <section class="card">
        <div class="form-group">
          <label for="mstage">Your stage</label>
          <select id="mstage">
            <optgroup label="Route 33 - CBD to Pipeline">
              <option>CBD (Accra Road)</option>
              <option>Makadara</option>
              <option>Jogoo Road</option>
              <option>Donholm Roundabout</option>
              <option>Quarry</option>
              <option>Tumaini</option>
              <option>Tassia</option>
              <option>Avenue Park</option>
              <option>Fedha</option>
              <option>Pipeline</option>
            </optgroup>
            <optgroup label="Route 111 - CBD to Ngong">
              <option>CBD (Railways)</option>
              <option>Kenyatta Hospital</option>
              <option>Adams Arcade</option>
              <option>Junction Mall</option>
              <option>Dagoretti Corner</option>
              <option>Lenana</option>
              <option>Karen</option>
              <option>Ngong Town</option>
            </optgroup>
          </select>
        </div>
      </section>

      <!-- FR-08 -->
      <section class="card">
        <h2>Matatu leaving now</h2>
        <button type="button" id="log-btn" class="btn btn-yellow btn-big btn-block">Log departure</button>
      </section>

      <!-- FR-09 -->
      <section class="card">
        <h2>Matatus in the queue</h2>
        <form action="#" method="post" id="queue-form">
          <div class="form-group">
            <label for="queue">Number of matatus waiting</label>
            <input type="number" id="queue" name="queue" min="0" value="3">
          </div>
          <button type="submit" class="btn btn-primary">Save queue count</button>
        </form>
      </section>
      <footer class="site-footer">
        <p>Created by Dramani Walter &middot; <a href="mailto:walter.dramani@strathmore.edu">walter.dramani@strathmore.edu</a></p>
      </footer>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
