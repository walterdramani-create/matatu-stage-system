<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile">
  <div class="layout">
    <aside class="sidebar">
      <img src="images/logo.png" alt="Web Based Matatu Stage Management System" class="logo">
      <a href="analytics.html" class="link">Reports</a>
      <a href="admin-upload.html" class="link">Upload reports</a>
      <a href="profile.html" class="link active">Profile</a>
      <div class="bottom"><a href="api/logout.php" class="link">Logout</a></div>
    </aside>

    <main class="main">
      <h1>Profile</h1>
      <p class="sub">Update your account details.</p>

      <div id="profile-msg" class="message" style="display:none;"></div>
      <form action="#" method="post" class="card" id="profile-form">
        <div class="profile-head">
          <div class="avatar">A</div>
          <div><strong>Admin</strong><br><small>Administrator</small></div>
        </div>
        <div class="form-group"><label for="name">Username</label><input type="text" id="name" name="name" value=""></div>
        <div class="form-group"><label for="current">Current password</label><input type="password" id="current" name="current" required></div>
        <div class="form-group"><label for="newpass">New password (leave empty to keep the old one)</label><input type="password" id="newpass" name="newpass"></div>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </form>
      <footer class="site-footer">
        <p>Created by Dramani Walter &middot; <a href="mailto:walter.dramani@strathmore.edu">walter.dramani@strathmore.edu</a></p>
      </footer>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
